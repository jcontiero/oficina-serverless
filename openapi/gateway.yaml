swagger: "2.0"
info:
  title: "Oficina Mecânica API Gateway"
  description: "Ponto de entrada único para o Sistema de Atendimento e Execução de Serviços da Oficina"
  version: "1.0.0"
schemes:
  - "https"
produces:
  - "application/json"
consumes:
  - "application/json"

paths:
  # ==========================================
  # 1. Roteamento para Cloud Function Serverless
  # ==========================================
  /auth/cpf:
    post:
      summary: "Autenticação de Cliente por CPF"
      operationId: "autenticarClienteCpf"
      x-google-backend:
        address: "https://${auth_function_host}/auth/cpf"
        protocol: "h2"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            required:
              - "cpf"
            properties:
              cpf:
                type: "string"
                example: "52998224725"
      responses:
        200:
          description: "Token JWT assinado com sucesso"
        400:
          description: "CPF inválido"
        403:
          description: "Cliente inativo"
        404:
          description: "Cliente não cadastrado"
    options:
      summary: "CORS Preflight"
      operationId: "corsAuthCpf"
      x-google-backend:
        address: "https://${auth_function_host}/auth/cpf"
        protocol: "h2"
      responses:
        204:
          description: "CORS Allow"

  /.well-known/jwks.json:
    get:
      summary: "Endpoint JWKS com Chaves Públicas"
      operationId: "obterJwks"
      x-google-backend:
        address: "https://${auth_function_host}/.well-known/jwks.json"
        protocol: "h2"
      responses:
        200:
          description: "Conjunto de chaves públicas RSA (RFC 7517)"

  # ==========================================
  # 2. Roteamento para API Backend no GKE
  # ==========================================
  /auth/login:
    post:
      summary: "Login de Funcionários e Administradores"
      operationId: "loginAdmin"
      x-google-backend:
        address: "https://${api_backend_host}/auth/login"
        disable_auth: true
      responses:
        200:
          description: "Token de acesso administrativo emitido"

  /ordens-de-servico:
    post:
      summary: "Abertura de Ordem de Serviço"
      operationId: "abrirOrdemDeServico"
      x-google-backend:
        address: "https://${api_backend_host}/ordens-de-servico"
        disable_auth: true
      responses:
        201:
          description: "Ordem de Serviço criada"
    get:
      summary: "Listagem de Ordens de Serviço"
      operationId: "listarOrdensDeServico"
      x-google-backend:
        address: "https://${api_backend_host}/ordens-de-servico"
        disable_auth: true
      responses:
        200:
          description: "Lista de Ordens de Serviço"

  /ordens-de-servico/{id}:
    get:
      summary: "Consulta de Ordem de Serviço por ID"
      operationId: "buscarOrdemDeServicoPorId"
      x-google-backend:
        address: "https://${api_backend_host}/ordens-de-servico/{id}"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Detalhes da Ordem de Serviço"

  /clientes:
    post:
      summary: "Cadastro de Cliente"
      operationId: "cadastrarCliente"
      x-google-backend:
        address: "https://${api_backend_host}/clientes"
        disable_auth: true
      responses:
        201:
          description: "Cliente cadastrado"
    get:
      summary: "Listagem de Clientes"
      operationId: "listarClientes"
      x-google-backend:
        address: "https://${api_backend_host}/clientes"
        disable_auth: true
      responses:
        200:
          description: "Lista de clientes"

  /veiculos:
    post:
      summary: "Cadastro de Veículo"
      operationId: "cadastrarVeiculo"
      x-google-backend:
        address: "https://${api_backend_host}/veiculos"
        disable_auth: true
      responses:
        201:
          description: "Veículo cadastrado"

  /servicos:
    get:
      summary: "Listagem de Serviços"
      operationId: "listarServicos"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/servicos"
        disable_auth: true
      responses:
        200:
          description: "Catálogo de serviços"

  /pecas:
    get:
      summary: "Listagem de Peças"
      operationId: "listarPecas"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/pecas"
        disable_auth: true
      responses:
        200:
          description: "Estoque de peças"

  /relatorios:
    get:
      summary: "Relatórios Gerenciais"
      operationId: "obterRelatorios"
      x-google-backend:
        address: "https://${api_backend_host}/relatorios"
        disable_auth: true
      responses:
        200:
          description: "Dados consolidados"

  /.well-known/admin-jwks.json:
    get:
      summary: "JWKS Administrativo (oficina-api)"
      operationId: "obterAdminJwks"
      x-google-backend:
        address: "https://${api_backend_host}/.well-known/admin-jwks.json"
        disable_auth: true
      responses:
        200:
          description: "Chaves publicas administrativas RS256"

  /v1/ordens-servico:
    post:
      summary: "Abertura de OS v1 (Saga)"
      operationId: "abrirOsV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico"
        disable_auth: true
      responses:
        202:
          description: "OS e Saga iniciadas"

  /v1/ordens-servico/{id}:
    get:
      summary: "Consulta OS v1"
      operationId: "consultarOsV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Detalhes da OS"

  /v1/ordens-servico/{id}/saga:
    get:
      summary: "Consulta estado da Saga"
      operationId: "consultarSagaV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}/saga"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Estado da Saga"

  /v1/ordens-servico/{id}/cancelar:
    post:
      summary: "Solicitar cancelamento da OS via Saga"
      operationId: "cancelarOsV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}/cancelar"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        202:
          description: "Compensacao iniciada"

  /v1/ordens-servico/{id}/saga/reprocessar-estorno:
    post:
      summary: "Reprocessar estorno pendente"
      operationId: "reprocessarEstornoV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}/saga/reprocessar-estorno"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        202:
          description: "Reprocessamento solicitado"

  /v1/ordens-servico/{id}/nova-rodada:
    post:
      summary: "Reabrir nova rodada apos recusa de orcamento"
      operationId: "novaRodadaOsV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}/nova-rodada"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Nova rodada iniciada"

  /v1/orcamentos/{id}/decisao:
    post:
      summary: "Decisao do cliente sobre orcamento"
      operationId: "decisaoOrcamentoV1"
      x-google-backend:
        address: "https://${billing_backend_host}/v1/orcamentos/{id}/decisao"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        202:
          description: "Decisao registrada"

  /v1/orcamentos/por-os/{os_id}:
    get:
      summary: "Consultar orcamento por OS"
      operationId: "orcamentoPorOsV1"
      x-google-backend:
        address: "https://${billing_backend_host}/v1/orcamentos/por-os/{os_id}"
        disable_auth: true
      parameters:
        - name: "os_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Orcamento"

  /v1/pagamentos/por-os/{os_id}:
    get:
      summary: "Consultar pagamento por OS"
      operationId: "pagamentoPorOsV1"
      x-google-backend:
        address: "https://${billing_backend_host}/v1/pagamentos/por-os/{os_id}"
        disable_auth: true
      parameters:
        - name: "os_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Pagamento"

  /webhooks/mercadopago:
    post:
      summary: "Webhook Mercado Pago"
      operationId: "webhookMercadoPago"
      x-google-backend:
        address: "https://${billing_backend_host}/webhooks/mercadopago"
        disable_auth: true
      responses:
        200:
          description: "Webhook processado"

  /v1/execucoes/{id}/diagnostico:
    post:
      summary: "Registrar diagnostico tecnico"
      operationId: "registrarDiagnosticoV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/execucoes/{id}/diagnostico"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        201:
          description: "Diagnostico registrado"

  /v1/execucoes/{id}/iniciar:
    post:
      summary: "Iniciar reparo"
      operationId: "iniciarExecucaoV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/execucoes/{id}/iniciar"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Execucao iniciada"

  /v1/execucoes/{id}/concluir:
    post:
      summary: "Concluir reparo"
      operationId: "concluirExecucaoV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/execucoes/{id}/concluir"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Execucao concluida"

  /v1/pecas:
    post:
      summary: "Cadastrar peca"
      operationId: "cadastrarPecaV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/pecas"
        disable_auth: true
      responses:
        201:
          description: "Peca cadastrada"
    get:
      summary: "Listar pecas"
      operationId: "listarPecasV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/pecas"
        disable_auth: true
      responses:
        200:
          description: "Lista de pecas"

  /v1/pecas/{id}:
    get:
      summary: "Buscar peca"
      operationId: "buscarPecaV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/pecas/{id}"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Peca"

  /v1/servicos:
    post:
      summary: "Cadastrar servico"
      operationId: "cadastrarServicoV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/servicos"
        disable_auth: true
      responses:
        201:
          description: "Servico cadastrado"
    get:
      summary: "Listar servicos"
      operationId: "listarServicosV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/servicos"
        disable_auth: true
      responses:
        200:
          description: "Lista de servicos"

  # JWT RS256 e perfil são obrigatórios no serviço de destino.
  /v1/ordens-servico/{id}/entrega:
    post:
      summary: "Registrar entrega do veículo"
      operationId: "entregarOsV1"
      x-google-backend:
        address: "https://${api_backend_host}/v1/ordens-servico/{id}/entrega"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Operação concluída"
        401:
          description: "JWT ausente ou inválido"
        403:
          description: "Perfil sem permissão"

  # JWT RS256 e perfil são obrigatórios no serviço de destino.
  /v1/execucoes:
    get:
      summary: "Listar execuções"
      operationId: "listarExecucoesV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/execucoes"
        disable_auth: true
      responses:
        200:
          description: "Operação concluída"
        401:
          description: "JWT ausente ou inválido"
        403:
          description: "Perfil sem permissão"

  # JWT RS256 e perfil são obrigatórios no serviço de destino.
  /v1/execucoes/{id}:
    get:
      summary: "Consultar execução"
      operationId: "consultarExecucaoV1"
      x-google-backend:
        address: "https://${execucao_backend_host}/v1/execucoes/{id}"
        disable_auth: true
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "Operação concluída"
        401:
          description: "JWT ausente ou inválido"
        403:
          description: "Perfil sem permissão"
