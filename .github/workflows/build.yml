name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src pytest tests/unit --cov=src --cov-report=xml:coverage.xml --cov-fail-under=0 -q

      - name: Configure SonarCloud New Code period
        run: |
          curl -s -X POST \
            "https://sonarcloud.io/api/new_code_periods/set?project=jcontiero_oficina-serverless&type=NUMBER_OF_DAYS&value=365" \
            -H "Authorization: Bearer ${{ secrets.SONAR_TOKEN }}"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
