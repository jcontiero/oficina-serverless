name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_cloud_apply:
        description: "Digite 'true' para autorizar a criacao/alteracao de recursos na nuvem (GCP)"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-serverless-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Serverless (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_cloud_apply == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Select canonical environment and backend
        id: target
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = main ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=homolog" >> "$GITHUB_OUTPUT"
          fi
      - name: Terraform Init (canonical state, no extra workspace)
        working-directory: terraform
        env:
          ENV_CANON: ${{ steps.target.outputs.environment }}
        run: terraform init -input=false -backend-config="prefix=services/oficina-serverless/${ENV_CANON}"
      - name: Terraform Plan
        working-directory: terraform
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: terraform plan -input=false -var-file="environments/${TARGET_BRANCH}.tfvars" -out=/tmp/serverless.tfplan
      - name: Terraform Apply exact saved plan
        working-directory: terraform
        run: terraform apply -input=false /tmp/serverless.tfplan
      - name: Remove sensitive temporary plan
        if: always()
        run: rm -f /tmp/serverless.tfplan
