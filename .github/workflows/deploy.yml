name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_cloud_apply:
        description: "Digite 'true' para autorizar a criacao/alteracao de recursos na nuvem (GCP)"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read
  checks: read

concurrency:
  group: terraform-serverless-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Serverless (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_cloud_apply == 'true' && github.ref == 'refs/heads/main'
    environment: homolog
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > /tmp/deploy-checks.json
          python - <<'PYTHON'
          import json
          checks = json.load(open('/tmp/deploy-checks.json'))['check_runs']
          for name in ['lint-test', 'SonarQube', 'SonarCloud Code Analysis']:
              matches = [c for c in checks if c['name'] == name]
              latest = max(matches, key=lambda c: c['id']) if matches else None
              if latest is None or latest['conclusion'] != 'success':
                  raise SystemExit(f'Check obrigatório ausente ou reprovado: {name}')
          PYTHON
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Select homolog canonical backend
        id: target
        run: echo "environment=homolog" >> "$GITHUB_OUTPUT"
      - name: Terraform Init (canonical state, no extra workspace)
        working-directory: terraform
        env:
          ENV_CANON: ${{ steps.target.outputs.environment }}
        run: terraform init -input=false -backend-config="prefix=services/oficina-serverless/${ENV_CANON}"
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -var-file=environments/homolog.tfvars -out=/tmp/serverless.tfplan
      - name: Terraform Apply exact saved plan
        working-directory: terraform
        run: terraform apply -input=false /tmp/serverless.tfplan
      - name: Remove sensitive temporary plan
        if: always()
        run: rm -f /tmp/serverless.tfplan
