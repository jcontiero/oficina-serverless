name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_cloud_apply:
        description: "Digite 'true' para autorizar a criacao/alteracao de recursos na nuvem (GCP)"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-serverless-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Serverless (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_cloud_apply == 'true'
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Workspace Select
        run: |
          WORKSPACE=${GITHUB_REF_NAME}
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -var-file="environments/${GITHUB_REF_NAME}.tfvars"
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="environments/${GITHUB_REF_NAME}.tfvars"
        working-directory: terraform
