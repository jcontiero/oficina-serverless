name: Terraform Deploy

on:
  push:
    branches:
      - homolog
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/pos-fiap-2026/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@pos-fiap-2026.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Workspace Select
        run: |
          WORKSPACE=${GITHUB_REF_NAME}
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="environments/${GITHUB_REF_NAME}.tfvars"
        working-directory: terraform
